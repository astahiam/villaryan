services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: villaryan
      POSTGRES_PASSWORD: villaryan
      POSTGRES_DB: villaryan
    ports:
      - "5432:5432"
    volumes:
      - villaryan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U villaryan -d villaryan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  villaryan_pgdata:
